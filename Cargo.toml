[package]
name = "nsbridge"
version = "0.1.0"
edition = "2024"

[dependencies]
freedesktop-icons = "0.4.0"
ico = "0.6.0"
icoextract_rs = "0.1.2"
nix = { version = "0.31.3", features = ["poll", "user"] }
png = "0.18.1"
resvg = "0.49.0"
rustbus = "0.19.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
usvg = "0.49.0"
x11rb = { version = "0.14.0", features = ["allow-unsafe-code"] }
